components:
    vivarium.public_health:
        results:
            - ResultsStratifier()
    vivarium_gates_lsff_2026_child:
        components:
            - EvenlyDistributedPopulation()
            - LBWSGPAFCalculationExposure()
            - SIS_with_birth_prevalence('diarrheal_diseases')
            - LBWSGPAFCalculationRiskEffect('cause.diarrheal_diseases.excess_mortality_rate')
            - LBWSGPAFObserver('cause.diarrheal_diseases.excess_mortality_rate')


configuration:
    input_data:
        input_draw_number: 0
        # No artifact_path here. The pipeline always passes -i, and any value
        # written here would be an absolute path into one working tree -- wrong
        # for every other clone, and stale the moment the layout moves. Pass
        # -i <artifact> when running this specification by hand.
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2022
            month: 1
            day: 1
        end:
            year: 2022
            month: 1
            day: 2
        step_size: 3 # Days
    population:
        population_size: 122_728
        initialization_age_min: 0
        initialization_age_max: 0.03835616 # 14 days
        untracking_age: 0.03835616 # 14 days

    intervention:
        child_scenario: 'baseline'
        maternal_scenario: 'baseline'

    stratification:
        default:
            - 'age_group'
            - 'sex'