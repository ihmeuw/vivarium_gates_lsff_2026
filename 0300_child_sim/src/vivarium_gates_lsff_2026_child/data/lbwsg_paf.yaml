components:
    vivarium.public_health:
        results:
            - ResultsStratifier()
    vivarium_gates_lsff_2026_child:
        components:
            - EvenlyDistributedPopulation()
            - LBWSGPAFCalculationExposure()
            - LBWSGPAFCalculationRiskEffect('cause.affected_unmodeled.cause_specific_mortality_rate')
            - LBWSGPAFObserver('cause.affected_unmodeled.cause_specific_mortality_rate')


configuration:
    input_data:
        input_draw_number: 0
        # No artifact_path here. The pipeline always passes -i, and any value
        # written here would be an absolute path into one working tree -- wrong
        # for every other clone, and stale the moment the layout moves. Pass
        # -i <artifact> when running this specification by hand.
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2022
            month: 1
            day: 1
        end:
            year: 2022
            month: 1
            day: 10
        step_size: 7 # Days
    population:
        population_size: 61_364
        initialization_age_min: 0
        initialization_age_max: 0.005
        untracking_age: 0.03835616 # 14 days

    intervention:
        child_scenario: 'baseline'
        maternal_scenario: 'baseline'

    mortality:
        unmodeled_causes:
            - "lower_respiratory_infections"
            - "malaria"
            - "measles"
            - "upper_respiratory_infections"
            - "otitis_media"
            - "meningitis"
            - "encephalitis"
            - "neonatal_preterm_birth"
            - "neonatal_encephalopathy_due_to_birth_asphyxia_and_trauma"
            - "neonatal_sepsis_and_other_neonatal_infections"
            - "hemolytic_disease_and_other_neonatal_jaundice"
            - "other_neonatal_disorders"
            - "sudden_infant_death_syndrome"

    stratification:
        default:
            - 'age_group'
            - 'sex'
