[build-system]
# NOTE: No setuptools_scm -- build-env installs this with '--no-build-isolation', so these
# requirements must already exist in the env. setuptools does; setuptools_scm does not.
# Hence the static version below.
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_lsff_2026_child"
version = "0.7.0"
description = "Child simulation package for the vivarium_gates_lsff_2026 project."
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dependencies = [
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]",
    "vivarium-artifact>=1.1.1",
    "vivarium-gbd-mapping>=6.0.7",
    "vivarium-engine>=5.11.0",
    "vivarium-public-health>=6.6.4",
    "vivarium-config-tree>=5.0.0",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "pytest-vivarium",
    "papermill",
    "jupyterlab",
]
cluster = ["vivarium-cluster-tools[cluster]>=4.8.0,<5.0.0"]
validation = ["vivarium-validation>=0.3.1"]
lint = ["vivarium-dependencies[lint]"]
interactive = [
    "vivarium-dependencies[interactive]",
    "nbdime",
]
data = [
    # TODO: replace both git references with released versions once GBD siloing
    # (MIC-7613) ships.
    "vivarium-inputs @ git+https://github.com/ihme-internal/vivarium_inputs.git@hjafari/mic-7663/gbd-access-8",
    "vivarium-gbd-access @ git+https://github.com/ihme-internal/vivarium_gbd_access.git@epic/mic-7365-silo-gbd-shared-functions",
]
simulation = ["pandas>=2.2.1"]
dev = ["vivarium_gates_lsff_2026_child[test,cluster,lint,interactive,simulation,data]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_lsff_2026"

# NOTE: Deliberately no 'make_artifacts' console script -- see the note in
# 0200_pregnancy_sim/pyproject.toml. The repo-level vivarium_gates_lsff_2026 package
# owns that name and dispatches here via '-p/--package child'.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vivarium_gates_lsff_2026_child" = ["**/*.yaml", "**/*.csv"]

[tool.black]
line_length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
# Keep in sync with the root pyproject.toml -- see the note there.
known_first_party = [
    "lsff_utils",
    "vivarium_gates_lsff_2026",
    "vivarium_gates_lsff_2026_child",
    "vivarium_gates_lsff_2026_maternal",
]
