components:
    vivarium.public_health:
        results:
            - DiseaseObserver("maternal_disorders")
            - DiseaseObserver("maternal_hemorrhage")

    vivarium_gates_lsff_2026_maternal:
        components:
            - BasePopulation()
            - Pregnancy()
            - UntrackNotPregnant()
            - MaternalDisorders()
            - MaternalHemorrhage()
            # - BackgroundMorbidity()
            - Hemoglobin()
            - Anemia()
            - VehicleConsumption()
            - IronFortification()
            - ResultsStratifier()
            - PregnancyObserver()
            - PregnancyOutcomeObserver()
            - BirthObserver()
            - MaternalMortalityObserver()
            - DisabilityObserver()
            - AnemiaObserver()
            - WealthQuintile()

configuration:
    input_data:
        input_draw_number: 0
        # No artifact_path here. The pipeline always passes -i, and any value
        # written here would be an absolute path into one working tree -- wrong
        # for every other clone, and stale the moment the layout moves. Pass
        # -i <artifact> when running this specification by hand.
    interpolation:
        order: 0
        extrapolate: True
    intervention:
        scenario: "baseline"
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2025
            month: 1
            day: 1
        end:
            year: 2025
            month: 12
            day: 31
        step_size: 7 # Days
    population:
        population_size: 50_000
        initialization_age_min: 10
        initialization_age_max: 54
        include_sex: "Female"
    stratification:
        default:
            - 'age_group'
            - 'wealth_quintile'
            - 'anemia_status_at_birth'
