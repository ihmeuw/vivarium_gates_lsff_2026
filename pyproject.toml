[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_lsff_2026"
description = "Vivarium simulation model for the vivarium_gates_lsff_2026 project."
readme = "README.rst"
# 3.11 floor, not 3.10: the `workflow` extra needs snakemake>=8.16, which requires
# 3.11. python_versions.json lists only 3.11 and 3.12 anyway.
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
# NOTE: Static, like the sub-packages. This repo carries no git tags, so setuptools_scm
# would only ever hit its fallback. Bump by hand.
version = "0.0.1"
dependencies = [
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]",
    "vivarium-build-utils>=4.4.2,<5.0.0",
    "vivarium-artifact>=1.1.1",
    "vivarium-gbd-mapping>=6.0.7",
    "vivarium-engine>=6.0.0,<7.0.0",
    "vivarium-public-health>=6.6.4",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "pytest-vivarium",
]
# NOTE: The [cluster] extras below are required, not optional. Both packages gate
# jobmon_installer_ihme behind them, and psimulate imports jobmon at module load, so
# a plain install yields a psimulate that dies with
# "ModuleNotFoundError: No module named 'jobmon'".
cluster = [
    "vivarium-cluster-tools[cluster]>=5.0.0,<6.0.0",
    "vivarium-psimulate[cluster]>=1.0.0,<2.0.0",
    "jobmon_installer_ihme>=10.12.2",
]
# Packages that read GBD. They are only on the IHME package index or in ihme-internal
# repositories, so they are kept out of the other extras: an install without [data]
# can run simulations but cannot make artifacts or run data prep.
data = [
    "vivarium-inputs>=9.2.0",
    "vivarium-gbd-access>=8.0.0",
    # The data-prep notebooks import db_queries directly rather than through vivarium_inputs.
    "db_queries",
    # The 0500 model notebook and the GBD V&V notebooks import it directly. It came in
    # through vivarium_gbd_access 7.x, and 8.x no longer depends on it.
    "ihme_cc_get_estimates[library]>=2.39.0,<3.0.0",
]
# Dependencies of the notebooks Snakemake runs through papermill (0100_data_prep,
# 0400, 0500 and 5000_analyze_results). These were previously listed in
# requirements.txt and installed into a Snakemake-built venv; the pipeline now runs
# in the environment environment.sh builds, so they have to be declared here to be
# installed at all.
notebooks = [
    "papermill",
    "ploomber-engine",  # Provides papermill's `--engine debug`, used by the debug profile.
    "xlsxwriter",  # Writes results_spreadsheet.xlsx.
    "openpyxl",  # extraction/integration/extract_*.py read the GF and literature workbooks.
    "statsmodels",
    "scikit-learn",
    "vivarium_gates_lsff_2026[interactive]",
]
interactive = ["vivarium-dependencies[interactive]", "vivarium-interactive>=1.0.0,<2.0.0"]
# Automated V&V notebooks under 5000_analyze_results/validation.
# NOTE: vivarium-validation's 'gbd' extra is not used. It contains only vivarium-inputs,
# which [data] provides, and it re-adds pandas and numpy caps.
# NOTE: jupyterlab is named explicitly rather than relied on transitively. [interactive]
# brings vivarium_dependencies[jupyter], whose 'jupyter' metapackage only started depending
# on jupyterlab in 1.1.0 (and otherwise reaches it via notebook>=7). Both are unpinned, so
# leaving it implicit makes 'jupyter lab' contingent on how the resolver happens to land.
validation = [
    "vivarium-validation>=0.5.0",
    "vivarium_gates_lsff_2026[interactive]",
    "jupyterlab",
]
lint = ["vivarium-dependencies[lint]"]
# Builds the Markdown notes in docs/ (make build-docs).
docs = ["vivarium-dependencies[sphinx]", "myst-parser"]
# Snakemake drives the pipeline. It lives in the model environment rather than one
# of its own because it does not need one: a rule's recipe activates the model
# environment in its own subshell, so the environment Snakemake is launched from is
# never inherited by a stage. Snakemake itself imports only lsff_utils, to resolve
# paths and read 0050_config.
# NOTE: The <9 cap is load-bearing, not caution. Snakemake 9 removed `Wildcards`
# from `snakemake.io`, which 0400_non_pregnant_anemia_model/Snakefile imports to
# synthesize the wildcards for its Ethiopia-folate variant, so the workflow fails
# to parse on 9.x. Lifting the cap means rewriting that rule first.
workflow = ["snakemake>=8.16,<9"]
simulation = [
    "pandas>=2.2.1",
    # Live-sim V&V (5000_analyze_results/validation/child_model/child_lbwsg.ipynb) runs FuzzyChecker.
    "vivarium-fuzzy-checker>=0.3.0",
]
dev = ["vivarium_gates_lsff_2026[test,cluster,interactive,lint,docs,simulation,notebooks,workflow,validation,data]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_lsff_2026"

[project.scripts]
make_artifacts = "vivarium_gates_lsff_2026.tools.cli:make_artifacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vivarium_gates_lsff_2026" = ["**/*.yaml", "**/*.ipynb"]

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
known_first_party = [
    "lsff_utils",
    "vivarium_gates_lsff_2026",
    "vivarium_gates_lsff_2026_child",
    "vivarium_gates_lsff_2026_maternal",
]
