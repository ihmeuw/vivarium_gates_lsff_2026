[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_lsff_2026"
description = "Vivarium simulation model for the vivarium_gates_lsff_2026 project."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
# NOTE: Static, like the sub-packages. This repo carries no git tags, so setuptools_scm
# would only ever hit its fallback. Bump by hand.
version = "0.0.1"
dependencies = [
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]",
    "vivarium-build-utils>=4.4.2,<5.0.0",
    "vivarium-gbd-mapping>=6.0.7",
    "vivarium-engine>=5.5.3",
    "vivarium-public-health>=6.4.5",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "pytest-vivarium",
]
# NOTE: The [cluster] extra is required, not optional. vivarium-cluster-tools gates
# jobmon_installer_ihme behind it, and psimulate imports jobmon at module load, so a
# plain "vivarium-cluster-tools" install yields a psimulate that dies with
# "ModuleNotFoundError: No module named 'jobmon'".
# NOTE: jobmon_installer_ihme is pinned here, not in the sub-package pyproject.toml files.
# vivarium-cluster-tools leaves it unpinned, and a fresh resolve of '.[data]' selects
# 10.6.5 -- whose jobmon has no 'http.gui_url' config key, so
# cluster_tools.core.jobmon.client.get_monitoring_url raises between binding a workflow
# and running it, and 'make_artifacts -l all' fails without submitting a task. This
# root install (base.mk's 'uv pip install -e .[data]') is the step that resolves jobmon;
# the sub-package install step cannot see the package on the index at all.
cluster = [
    "vivarium-cluster-tools[cluster]>=4.2.14",
    "jobmon_installer_ihme>=10.12.2",
]
data = [
    "vivarium-inputs>=8.0.2",
    "vivarium_gates_lsff_2026[cluster]",
    # Automated V&V (5000_analyze_results/validation) runs in the artifact env, so it
    # belongs on this path -- see the [validation] extra below.
    "vivarium_gates_lsff_2026[validation]",
]
interactive = ["vivarium-dependencies[interactive]"]
# Automated V&V notebooks under 5000_analyze_results/validation.
# NOTE: As of vivarium-validation v0.3.1 the 'gbd' extra contains only vivarium-inputs
# NOTE: jupyterlab is named explicitly rather than relied on transitively. [interactive]
# brings vivarium_dependencies[jupyter], whose 'jupyter' metapackage only started depending
# on jupyterlab in 1.1.0 (and otherwise reaches it via notebook>=7). Both are unpinned, so
# leaving it implicit makes 'jupyter lab' contingent on how the resolver happens to land.
validation = [
    "vivarium-validation[gbd]>=0.3.1",
    "vivarium_gates_lsff_2026[interactive]",
    "jupyterlab",
]
lint = ["vivarium-dependencies[lint]"]
# NOTE: Simulation-only pandas floor -- keep it out of [project.dependencies] and [data].
# The artifact env is hard-capped to pandas<2.0 via vivarium-inputs -> vivarium-gbd-access
# -> ihme-cc-dependencies, so a floor on either path is unresolvable. build-env installs
# [dev] for type=simulation and [data] for type=artifact.
simulation = [
    "pandas>=2.2.1",
    # Live-sim V&V (5000_analyze_results/validation/child_model/child_lbwsg.ipynb) runs
    # FuzzyChecker inside the simulation env; the full vivarium-validation stack stays on
    # the artifact path.
    "vivarium-fuzzy-checker>=0.3.0",
]
dev = ["vivarium_gates_lsff_2026[test,cluster,interactive,lint,simulation]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_lsff_2026"

[project.scripts]
make_artifacts = "vivarium_gates_lsff_2026.tools.cli:make_artifacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vivarium_gates_lsff_2026" = ["**/*.yaml", "**/*.ipynb"]

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
known_first_party = [
    "lsff_utils",
    "vivarium_gates_lsff_2026",
    "vivarium_gates_lsff_2026_child",
    "vivarium_gates_lsff_2026_maternal",
]
